services:
  postgres:
    image: postgres:17-alpine
    container_name: qf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizfunnels
      POSTGRES_PASSWORD: quizfunnels
      POSTGRES_DB: quizfunnels
    ports:
      # 5433 no host de propósito: 5432 costuma já estar tomado por uma
      # instalação nativa do Postgres, e o conflito só aparece como "senha
      # inválida", que é confuso de diagnosticar.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizfunnels -d quizfunnels"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento S3-compatível. Em produção troca-se por S3/R2 mudando só as env vars.
  minio:
    image: minio/minio:latest
    container_name: qf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket público de assets no primeiro boot e encerra.
  minio-init:
    image: minio/mc:latest
    container_name: qf_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/quiz-funnels;
      mc anonymous set download local/quiz-funnels;
      echo 'bucket quiz-funnels pronto';
      "

  # Caixa de e-mail local: SMTP em 1025, interface web em 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: qf_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
